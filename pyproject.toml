[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tenderrisk"
version = "1.0.0"
description = "Grounded contractor-side tender risk analysis API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "openai>=1.0,<3.0",
  "pydantic>=2.8,<3.0",
  "pymupdf>=1.24,<2.0",
  "pdfplumber>=0.11,<1.0",
  "python-dotenv>=1.0,<2.0",
  "python-docx>=1.1,<2.0",
  "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/tenderrisk"]

[tool.hatch.build]
include = ["src/tenderrisk/prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
